services:
  postgres:
    image: postgres:15
    container_name: taskqueue_postgres
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpassword
      POSTGRES_DB: taskqueue_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d taskqueue_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: taskqueue_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: taskqueue_api
    environment:
      DATABASE_URL: postgresql://taskuser:taskpassword@postgres:5432/taskqueue_db
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: taskqueue_worker
    environment:
      DATABASE_URL: postgresql://taskuser:taskpassword@postgres:5432/taskqueue_db
      REDIS_URL: redis://redis:6379
      METRICS_PORT: "9100"
    ports:
      - "9100:9100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  scheduler:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    container_name: taskqueue_scheduler
    environment:
      DATABASE_URL: postgresql://taskuser:taskpassword@postgres:5432/taskqueue_db
      REDIS_URL: redis://redis:6379
      METRICS_PORT: "9200"
    ports:
      - "9200:9200"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: taskqueue_dashboard
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: on-failure

  prometheus:
    image: prom/prometheus:latest
    container_name: taskqueue_prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - api
      - worker
      - scheduler
    restart: on-failure

  grafana:
    image: grafana/grafana:latest
    container_name: taskqueue_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
    depends_on:
      - prometheus
    restart: on-failure

volumes:
  postgres_data: