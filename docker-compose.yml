version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: taskqueue_postgres
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpassword
      POSTGRES_DB: taskqueue_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: taskqueue_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: